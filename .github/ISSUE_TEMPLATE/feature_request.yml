name: 💡 Feature request
description: Propose a new feature, runtime, or API
title: "[feat] "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Before opening this, please check that:
        - There is not already a similar [open issue](https://github.com/mondrian-framework/mondrian-framework/issues?q=is%3Aissue+label%3Aenhancement) or [discussion](https://github.com/mondrian-framework/mondrian-framework/discussions).
        - For larger ideas, consider starting a [Discussion](https://github.com/mondrian-framework/mondrian-framework/discussions) first to align on direction before investing in design.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user problem, not the solution. What are you trying to do that's hard or impossible today?
      placeholder: I am trying to ... but Mondrian doesn't let me ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you solve it? A code sketch is encouraged.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why you discarded them.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Roughly how big do you think this is?
      options:
        - Small (a few lines, no breaking change)
        - Medium (one package, no breaking change)
        - Large (cross-package or new package)
        - Breaking change
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, prior art from other frameworks, related issues, anything else.
    validations:
      required: false
